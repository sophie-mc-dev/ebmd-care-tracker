<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ebmd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#ebmd-bg)" />

  <!-- Outer Protective Shield Ring -->
  <path d="M256 86 C170 86 98 152 74 256 C98 360 170 426 256 426 C342 426 414 360 438 256 C414 152 342 86 256 86 Z" 
        fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Eye Contour -->
  <path d="M100 256 C144 176 200 136 256 136 C312 136 368 176 412 256 C368 336 312 376 256 376 C200 376 144 336 100 256 Z" 
        fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="68" fill="url(#iris-grad)" stroke="#0e7490" stroke-width="6"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="32" fill="#0f172a" />

  <!-- Corneal Surface / Tear Layer Reflection -->
  <path d="M228 226 C232 214 246 206 260 208 C266 210 274 216 276 222 C264 220 248 224 228 226 Z" fill="#ffffff" opacity="0.9" />
  <circle cx="242" cy="242" r="6" fill="#ffffff" opacity="0.8" />

  <!-- Soothing Lubricant Tear Drop / Shield Icon at bottom-right corner -->
  <g transform="translate(320, 290) scale(0.65)" filter="url(#soft-glow)">
    <circle cx="90" cy="90" r="80" fill="#042f2e" opacity="0.4" />
    <path d="M90 20 C90 20 40 85 40 120 C40 148 62 170 90 170 C118 170 140 148 140 120 C140 85 90 20 90 20 Z" 
          fill="#38bdf8" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="78" cy="115" rx="10" ry="22" transform="rotate(-25 78 115)" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
